# ============================================
# TorStream - Default Server Configuration
# ============================================

upstream app {
    server app:8000;
    keepalive 32;
}

# HTTP server - redirect to HTTPS if SSL is configured
server {
    listen 80;
    server_name _;
    
    # Client max body size (5GB for video uploads)
    client_max_body_size 5120M;
    
    # Timeouts for large uploads
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Security
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Video streaming via X-Accel-Redirect
    location /videos/ {
        internal;
        alias /var/www/videos/;
        
        # Enable range requests for streaming
        add_header Accept-Ranges bytes;
        
        # Optimize for video delivery
        tcp_nopush off;
        
        # Cache headers
        expires 1h;
        add_header Cache-Control "private, must-revalidate";
    }
    
    # Preview clips
    location /previews/ {
        internal;
        alias /var/www/previews/;
        
        add_header Accept-Ranges bytes;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # Rate limit login attempts
    location /auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
    
    # Rate limit API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
    
    # Webhook endpoint (no rate limit)
    location /payment/webhook {
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
    
    # Main application
    location / {
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
    
    # Health check
    location /health {
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
        access_log off;
    }
}

# Tor hidden service optimized server
server {
    listen 80;
    server_name localhost;
    
    # Same configuration as above but optimized for Tor
    client_max_body_size 5120M;
    
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Disable access logging for Tor (privacy)
    access_log off;
    
    location /static/ {
        alias /var/www/static/;
        expires 1d;
        access_log off;
    }
    
    location /videos/ {
        internal;
        alias /var/www/videos/;
        add_header Accept-Ranges bytes;
        tcp_nopush off;
    }
    
    location /previews/ {
        internal;
        alias /var/www/previews/;
        add_header Accept-Ranges bytes;
    }
    
    location / {
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
